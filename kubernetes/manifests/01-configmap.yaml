apiVersion: v1
kind: ConfigMap
metadata:
  name: tickets-config
  namespace: tickets
data:
  INVENTORY_URL: http://inventory:8000
  PAYMENTS_URL: http://payments:8000
  NOTIFICATIONS_URL: http://notifications:8000
  RESERVATIONS_URL: http://reservations:8000
  INVENTORY_TIMEOUT_SECONDS: "3"
  PAYMENT_TIMEOUT_SECONDS: "3"
  NOTIFICATION_TIMEOUT_SECONDS: "2"
  GATEWAY_TIMEOUT_SECONDS: "10"
  INVENTORY_MAX_RETRIES: "3"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "3"
  CIRCUIT_BREAKER_RECOVERY_SECONDS: "20"
  PAYMENT_DELAY_SECONDS: "0"
  PAYMENT_FAILURE_RATE: "0"
  NOTIFICATION_DELAY_SECONDS: "0"
  NOTIFICATION_FAILURE_RATE: "0"
