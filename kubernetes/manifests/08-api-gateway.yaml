apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tickets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tickets/api-gateway:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tickets-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tickets
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
